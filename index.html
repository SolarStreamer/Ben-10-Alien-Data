<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ben 10 Aliens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Ben 10 Aliens</h1>
    <p>Browse or search aliens by name or species.</p>
  </header>

  <main>
    <!-- Search section -->
    <section class="search-section">
      <input
        type="text"
        id="searchInput"
        placeholder="Search alien or species (e.g. Heatblast or Pyronite)"
      />
      <button id="searchButton">Search</button>
      <div id="searchResult"></div>
    </section>

    <!-- Homepage list (scrollable) -->
    <section class="alien-list-section">
      <h2>All Aliens</h2>
      <div id="alienList" class="alien-list"></div>
    </section>
  </main>

  <footer>
    <p>Made for fun — Ben 10 aliens fan site.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
